name: Extract Godot Project into Repository

on:
  # Any committed replacement of the source archive automatically refreshes
  # the extracted project on the same branch (including main).
  push:
    branches:
      - "**"
    paths:
      - "Kindlewake_Project.zip"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: extract-project-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Validate and extract archive transactionally
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import os
          import shutil
          import stat
          import tempfile

          archive = Path("Kindlewake_Project.zip")
          target = Path("Kindlewake")
          if not archive.is_file():
              raise SystemExit("Kindlewake_Project.zip is missing from the repository root.")

          with tempfile.TemporaryDirectory(prefix="kindlewake-extract-") as temp:
              staging = Path(temp) / "staging"
              staging.mkdir()
              extracted = 0
              skipped = 0

              with ZipFile(archive) as zf:
                  entries = zf.infolist()
                  if not entries:
                      raise SystemExit("The project archive is empty.")

                  for info in entries:
                      raw = info.filename.replace("\\\\", "/")
                      rel = PurePosixPath(raw)
                      if rel.is_absolute() or not rel.parts or any(p in ("", ".", "..") for p in rel.parts):
                          raise SystemExit(f"Unsafe archive path: {info.filename}")
                      if rel.parts[0] != "Kindlewake":
                          raise SystemExit(f"Unexpected archive root: {info.filename}")
                      if ".godot" in rel.parts or "__MACOSX" in rel.parts or rel.name == ".DS_Store":
                          skipped += 1
                          continue
                      mode = (info.external_attr >> 16) & 0xFFFF
                      if stat.S_ISLNK(mode):
                          raise SystemExit(f"Symbolic link rejected: {info.filename}")

                      destination = staging.joinpath(*rel.parts)
                      if info.is_dir():
                          destination.mkdir(parents=True, exist_ok=True)
                          continue
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      destination.write_bytes(zf.read(info))
                      extracted += 1

              staged_project = staging / "Kindlewake"
              if not (staged_project / "project.godot").is_file():
                  raise SystemExit("Archive did not contain Kindlewake/project.godot.")
              if not (staged_project / "tools/gd_static_check.py").is_file():
                  raise SystemExit("Archive is missing tools/gd_static_check.py.")

              backup = Path(temp) / "previous-Kindlewake"
              if target.exists():
                  os.replace(target, backup)
              try:
                  os.replace(staged_project, target)
              except Exception:
                  if backup.exists() and not target.exists():
                      os.replace(backup, target)
                  raise
              if backup.exists():
                  shutil.rmtree(backup)

          print(f"Extracted project files: {extracted}")
          print(f"Skipped cache/OS metadata entries: {skipped}")
          PY

      - name: Run static GDScript checks
        working-directory: Kindlewake
        run: python3 -I tools/gd_static_check.py

      - name: Run Android build preflight
        working-directory: Kindlewake
        run: python3 tools/build_apk.py --check

      - name: Commit extracted project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Kindlewake/
          if git diff --cached --quiet; then
            echo "Extracted project is already up to date."
            exit 0
          fi
          git commit -m "Sync Kindlewake source from updated project archive"
          git push origin "HEAD:${{ github.ref_name }}"
