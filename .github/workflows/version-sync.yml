name: Synchronize Project Version

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: version-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-pull-request:
    name: Test proposed version tool and metadata
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the triggering source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Test proposed version synchronizer
        run: python Kindlewake/tests/test_sync_version.py

      - name: Require all proposed metadata to match project.godot
        run: python Kindlewake/tools/sync_version.py --project-dir Kindlewake --check

  synchronize-main:
    name: Apply version metadata on main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Test main version synchronizer
        run: python Kindlewake/tests/test_sync_version.py

      - name: Automatically repair metadata on main
        run: python Kindlewake/tools/sync_version.py --project-dir Kindlewake --apply

      - name: Commit automatic metadata correction
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Kindlewake/README.md Kindlewake/export_presets.cfg Kindlewake/scripts/core/save_system.gd; then
            echo "Main version metadata is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Kindlewake/README.md Kindlewake/export_presets.cfg Kindlewake/scripts/core/save_system.gd
          git commit -m "chore: synchronize README, Android and save metadata versions"
          git push
