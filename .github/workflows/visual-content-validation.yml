name: Visual Content Validation

on:
  push:
    branches:
      - "art/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-content-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  godot-validation:
    name: Godot import, scene smoke and strict tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact visual branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Download official Godot 4.2.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/godot"
          curl --fail --location --retry 3 --output "${RUNNER_TEMP}/godot.zip" \
            https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip
          unzip -q "${RUNNER_TEMP}/godot.zip" -d "${RUNNER_TEMP}/godot"
          chmod +x "${RUNNER_TEMP}/godot/Godot_v4.2.2-stable_linux.x86_64"
          ln -s "${RUNNER_TEMP}/godot/Godot_v4.2.2-stable_linux.x86_64" "${RUNNER_TEMP}/godot/godot"
          echo "${RUNNER_TEMP}/godot" >> "${GITHUB_PATH}"

      - name: Import project and SVG assets
        run: godot --headless --editor --path Kindlewake --quit

      - name: Smoke-load all scenes
        run: godot --headless --path Kindlewake --script res://tests/scene_smoke_test.gd

      - name: Run strict gameplay and visual-content regression suite
        run: godot --headless --path Kindlewake --script res://tests/run_tests.gd

      - name: Validate battlefield atlas source geometry
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          path = Path("Kindlewake/assets/art/tiles/battlefield_surface_atlas.svg")
          root = ET.parse(path).getroot()
          assert root.attrib.get("width") == "1408"
          assert root.attrib.get("height") == "32"
          assert root.attrib.get("viewBox") == "0 0 1408 32"
          groups = [node for node in root if node.tag.endswith("}g")]
          assert len(groups) == 22, f"expected 22 top-level cells, got {len(groups)}"
          ids = [group.attrib.get("id") for group in groups]
          assert len(set(ids)) == 22 and ids[0] == "grass_v1" and ids[-1] == "cliff_v2"
          text = path.read_text(encoding="utf-8")
          assert "href=" not in text and "<image" not in text
          print("PASS: 22 original 64x32 cells; no linked or embedded raster assets")
          PY
