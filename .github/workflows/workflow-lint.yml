name: Workflow YAML Lint

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  lint:
    name: Parse all GitHub Actions workflow YAML files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Validate workflow YAML syntax
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml
          paths = sorted(Path(".github/workflows").glob("*.yml"))
          if not paths:
              raise SystemExit("No workflow YAML files found.")
          for path in paths:
              with path.open(encoding="utf-8") as stream:
                  yaml.safe_load(stream)
              print("PASS:", path)
          print("Validated", len(paths), "workflow YAML files.")

          # Routine builds must never create public releases with the CI signing key.
          build = yaml.safe_load(Path(".github/workflows/build-apk.yml").read_text(encoding="utf-8"))
          build_jobs = build.get("jobs", {})
          if build.get("permissions", {}).get("contents") != "read":
              raise SystemExit("Build Android APK must default to contents: read.")
          if "publish-tag-release" in build_jobs:
              raise SystemExit("Routine APK workflow must not publish GitHub Releases.")
          for job_name, job in build_jobs.items():
              effective = job.get("permissions", build.get("permissions", {}))
              if effective.get("contents") != "read":
                  raise SystemExit(f"Build job {job_name} must use contents: read.")

          # Only the protected production workflow may write releases, and its
          # manifest must identify the tag checkout rather than dispatch context.
          release = yaml.safe_load(Path(".github/workflows/publish-android-release.yml").read_text(encoding="utf-8"))
          release_jobs = release.get("jobs", {})
          publish = release_jobs.get("publish", {})
          rejected = release_jobs.get("rejected", {})
          if release.get("permissions", {}).get("contents") != "read":
              raise SystemExit("Production workflow must default to contents: read.")
          if publish.get("permissions", {}).get("contents") != "write":
              raise SystemExit("Only the production publish job may use contents: write.")
          if rejected.get("permissions", {}).get("contents") != "none":
              raise SystemExit("The rejected-confirmation job must have no repository permissions.")
          source_step = next((step for step in publish.get("steps", []) if step.get("id") == "release-source"), {})
          manifest_step = next((step for step in publish.get("steps", []) if step.get("name") == "Create production release checksums and manifest"), {})
          if "git rev-parse HEAD" not in source_step.get("run", ""):
              raise SystemExit("Production workflow must capture the exact checked-out tag SHA.")
          if manifest_step.get("env", {}).get("SOURCE_SHA") != "${{ steps.release-source.outputs.sha }}":
              raise SystemExit("Release manifest SOURCE_SHA must come from the checked-out tag.")
          print("PASS: routine APK builds cannot publish; protected release owns write access and exact tag provenance.")
          PY

      - name: Test source handoff and organizer safety tools
        run: |
          set -euo pipefail
          python3 -m unittest discover -s Kindlewake/tests -p 'test_source_handoff.py' -v
          python3 -m unittest discover -s Kindlewake/tests -p 'test_repository_organizer.py' -v
          python3 -m unittest discover -s Kindlewake/tests -p 'test_project_health_audit.py' -v
          python3 Kindlewake/tools/project_health_audit.py --root . --output "$RUNNER_TEMP/project-health-audit"

      - name: Smoke-test read-only branch hygiene report
        run: |
          set -euo pipefail
          git fetch --prune origin
          python3 Kindlewake/tools/branch_hygiene.py --base main --report-dir "$RUNNER_TEMP/branch-hygiene"
          test -s "$RUNNER_TEMP/branch-hygiene/branch-hygiene.md"
