name: Workflow YAML Lint

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  lint:
    name: Parse all GitHub Actions workflow YAML files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Validate workflow YAML syntax
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml
          paths = sorted(Path(".github/workflows").glob("*.yml"))
          if not paths:
              raise SystemExit("No workflow YAML files found.")
          for path in paths:
              with path.open(encoding="utf-8") as stream:
                  yaml.safe_load(stream)
              print("PASS:", path)
          print("Validated", len(paths), "workflow YAML files.")

          # Guard the Android build workflow's least-privilege boundary.
          build = yaml.safe_load(Path(".github/workflows/build-apk.yml").read_text(encoding="utf-8"))
          jobs = build.get("jobs", {})
          if build.get("permissions", {}).get("contents") != "read":
              raise SystemExit("Build Android APK must default to contents: read.")
          for job_name, job in jobs.items():
              if job_name == "publish-tag-release":
                  continue
              effective = job.get("permissions", build.get("permissions", {}))
              if effective.get("contents") != "read":
                  raise SystemExit(f"Build job {job_name} must use contents: read.")
          publish = jobs.get("publish-tag-release", {})
          if publish.get("permissions", {}).get("contents") != "write":
              raise SystemExit("Only the tag-release job may use contents: write.")
          if publish.get("needs") != "apk" or "refs/tags/" not in publish.get("if", ""):
              raise SystemExit("The write-capable release job must depend on the APK build and be tag-only.")
          print("PASS: Android build permissions are read-only; tag release is isolated.")
          PY

      - name: Test source handoff and organizer safety tools
        run: |
          set -euo pipefail
          python3 -m unittest discover -s Kindlewake/tests -p 'test_source_handoff.py' -v
          python3 -m unittest discover -s Kindlewake/tests -p 'test_repository_organizer.py' -v
          python3 -m unittest discover -s Kindlewake/tests -p 'test_project_health_audit.py' -v
          python3 Kindlewake/tools/project_health_audit.py --root . --output "$RUNNER_TEMP/project-health-audit"

      - name: Smoke-test read-only branch hygiene report
        run: |
          set -euo pipefail
          git fetch --prune origin
          python3 Kindlewake/tools/branch_hygiene.py --base main --report-dir "$RUNNER_TEMP/branch-hygiene"
          test -s "$RUNNER_TEMP/branch-hygiene/branch-hygiene.md"
