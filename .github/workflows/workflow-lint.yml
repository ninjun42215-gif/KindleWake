name: Workflow YAML Lint

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  lint:
    name: Parse all GitHub Actions workflow YAML files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate workflow YAML syntax
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml
          paths = sorted(Path(".github/workflows").glob("*.yml"))
          if not paths:
              raise SystemExit("No workflow YAML files found.")
          for path in paths:
              with path.open(encoding="utf-8") as stream:
                  yaml.safe_load(stream)
              print("PASS:", path)
          print("Validated", len(paths), "workflow YAML files.")
          PY

      - name: Test source handoff and organizer safety tools
        run: |
          set -euo pipefail
          python3 -m unittest discover -s Kindlewake/tests -p 'test_source_handoff.py' -v
          python3 -m unittest discover -s Kindlewake/tests -p 'test_repository_organizer.py' -v

      - name: Smoke-test read-only branch hygiene report
        run: |
          set -euo pipefail
          git fetch --prune origin
          python3 Kindlewake/tools/branch_hygiene.py --base main --report-dir "$RUNNER_TEMP/branch-hygiene"
          test -s "$RUNNER_TEMP/branch-hygiene/branch-hygiene.md"
