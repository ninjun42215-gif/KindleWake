name: Godot Headless Tests

on:
  push:
    branches:
      - "main"
      - "feature/**"
      - "test/**"
      - "ci/**"
  pull_request:
    branches:
      - "main"
      - "feature/**"
      - "test/**"
      - "ci/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-headless-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  headless-tests:
    name: Import project and run deterministic test suite
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Cache Godot 4.2.2 editor
        uses: actions/cache@v4
        with:
          path: ~/.cache/kindlewake-godot-4.2.2
          key: godot-4.2.2-linux-x86_64

      - name: Install Godot 4.2.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/kindlewake-godot-4.2.2"
          GODOT="$HOME/.cache/kindlewake-godot-4.2.2/Godot_v4.2.2-stable_linux.x86_64"
          if [[ ! -x "$GODOT" ]]; then
            curl --fail --location --retry 3 \
              "https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip" \
              --output "$RUNNER_TEMP/godot.zip"
            unzip -o "$RUNNER_TEMP/godot.zip" -d "$HOME/.cache/kindlewake-godot-4.2.2"
            chmod +x "$GODOT"
          fi
          "$GODOT" --version

      - name: Import project resources
        shell: bash
        run: |
          set -euo pipefail
          "$HOME/.cache/kindlewake-godot-4.2.2/Godot_v4.2.2-stable_linux.x86_64" \
            --headless --editor --path Kindlewake --quit

      - name: Run full headless tests and boss balance simulations
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$HOME/.cache/kindlewake-godot-4.2.2/Godot_v4.2.2-stable_linux.x86_64"
          mkdir -p Kindlewake/dist/logs
          "$GODOT" --headless --path Kindlewake res://tests/HeadlessTestRunner.tscn \
            2>&1 | tee Kindlewake/dist/logs/godot-headless-tests.txt

      - name: Upload headless test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kindlewake-Godot-Headless-Test-Log
          path: Kindlewake/dist/logs/godot-headless-tests.txt
          if-no-files-found: warn
          retention-days: 30
