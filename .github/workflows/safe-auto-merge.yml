# Merge only after all four required workflows pass for the exact PR head SHA.
# The REST merge endpoint enforces the expected head and any repository branch rules.
name: Safe Auto Merge

on:
  workflow_run:
    workflows:
      - Build Android APK
    types:
      - completed

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: safe-auto-merge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  merge-safe-pr:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Find the unique open PR for this exact commit
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          # workflow_run.pull_requests can be empty. Query open PRs and match
          # the exact head SHA instead; fail closed unless exactly one matches.
          gh pr list --state open --base main \
            --json number,isDraft,mergeable,headRefOid,baseRefName > prs.json
          matches="$(jq --arg sha "${SHA}" '[.[] | select(.headRefOid == $sha)]' prs.json)"
          count="$(jq 'length' <<< "${matches}")"
          if [[ "${count}" != "1" ]]; then
            echo "::notice::Expected exactly one open PR for ${SHA}; found ${count}. Refusing auto-merge."
            exit 1
          fi

          pr_number="$(jq -r '.[0].number' <<< "${matches}")"
          gh pr view "${pr_number}" --json isDraft,mergeable,headRefOid,baseRefName > pr.json
          jq -e --arg sha "${SHA}" \
            '.isDraft == false and .mergeable == "MERGEABLE" and .headRefOid == $sha and .baseRefName == "main"' pr.json >/dev/null || {
              echo "::notice::PR is draft, conflicted, stale, or not targeting main; refusing to merge."
              exit 1
            }
          echo "pr_number=${pr_number}" >> "$GITHUB_OUTPUT"

      - name: Verify every required workflow for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          # workflow_run jobs have no checked-out repository, so use the REST API
          # rather than gh run list (which depends on local git metadata).
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${SHA}&per_page=100" \
            --jq '.workflow_runs[] | {name, event, conclusion, head_sha}' | jq -s '.' > runs.json
          required_workflows=("Build Android APK" "Synchronize Project Version" "Workflow YAML Lint" "Project Health Audit")
          for attempt in $(seq 1 20); do
            gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${SHA}&per_page=100" \
              --jq '.workflow_runs[] | {name, event, conclusion, status, created_at}' | jq -s '.' > runs.json
            all_passed=true
            for required in "${required_workflows[@]}"; do
              latest="$(jq -c --arg name "${required}" --arg sha "${SHA}" \
                '[.[] | select(.name == $name and .event == "pull_request")] | sort_by(.created_at) | last // empty' runs.json)"
              conclusion="$(jq -r '.conclusion // empty' <<< "${latest}")"
              status="$(jq -r '.status // empty' <<< "${latest}")"
              if [[ "${conclusion}" == "success" ]]; then
                continue
              fi
              if [[ "${status}" == "completed" ]]; then
                echo "::error::Required workflow failed for exact head ${SHA}: ${required} (${conclusion})"
                exit 1
              fi
              all_passed=false
            done
            if [[ "${all_passed}" == "true" ]]; then
              echo "All four required workflows passed for ${SHA}."
              exit 0
            fi
            echo "Waiting for all four exact-SHA workflows (attempt ${attempt}/20)..."
            sleep 15
          done
          echo "::error::Timed out waiting for all required workflows on ${SHA}."
          exit 1

      - name: Merge PR through GitHub API after exact-SHA checks pass
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.gate.outputs.pr_number }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # This job has no local Git checkout. Use the REST merge endpoint and
          # require the exact SHA again so a concurrent push cannot be merged.
          response="$(gh api --method PUT "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/merge" \
            -f sha="${SHA}" -f merge_method=squash)"
          jq -e '.merged == true' <<< "${response}" >/dev/null
