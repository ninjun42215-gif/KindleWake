# Merge only after the Android build and version guard both pass for the exact PR head.
# GitHub's native auto-merge remains subject to repository branch rules and required checks.
name: Safe Auto Merge

on:
  workflow_run:
    workflows:
      - Build Android APK
      - Synchronize Project Version
    types:
      - completed

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: safe-auto-merge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  enable-auto-merge:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Find the unique open PR for this exact commit
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          # workflow_run.pull_requests can be empty. Query open PRs and match
          # the exact head SHA instead; fail closed unless exactly one matches.
          gh pr list --state open --base main \
            --json number,isDraft,mergeable,headRefOid,baseRefName > prs.json
          matches="$(jq --arg sha "${SHA}" '[.[] | select(.headRefOid == $sha)]' prs.json)"
          count="$(jq 'length' <<< "${matches}")"
          if [[ "${count}" != "1" ]]; then
            echo "::notice::Expected exactly one open PR for ${SHA}; found ${count}. Refusing auto-merge."
            exit 1
          fi

          pr_number="$(jq -r '.[0].number' <<< "${matches}")"
          gh pr view "${pr_number}" --json isDraft,mergeable,headRefOid,baseRefName > pr.json
          jq -e --arg sha "${SHA}" \
            '.isDraft == false and .mergeable == "MERGEABLE" and .headRefOid == $sha and .baseRefName == "main"' pr.json >/dev/null || {
              echo "::notice::PR is draft, conflicted, stale, or not targeting main; refusing to merge."
              exit 1
            }
          echo "pr_number=${pr_number}" >> "$GITHUB_OUTPUT"

      - name: Verify every required workflow for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          # workflow_run jobs have no checked-out repository, so use the REST API
          # rather than gh run list (which depends on local git metadata).
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${SHA}&per_page=100" \
            --jq '.workflow_runs[] | {name, event, conclusion, head_sha}' | jq -s '.' > runs.json
          for required in "Build Android APK" "Synchronize Project Version"; do
            if ! jq -e --arg name "${required}" --arg sha "${SHA}" \
              'any(.[]; .name == $name and .event == "pull_request" and .head_sha == $sha and .conclusion == "success")' runs.json >/dev/null; then
              echo "::notice::Required workflow not successful for ${SHA}: ${required}"
              exit 1
            fi
          done

      - name: Merge PR after exact-SHA checks pass
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.gate.outputs.pr_number }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # GitHub enforces any configured branch rules. Match the exact SHA
          # again at merge time so a new push can never be merged accidentally.
          gh pr merge "${PR_NUMBER}" --squash --match-head-commit "${SHA}"
