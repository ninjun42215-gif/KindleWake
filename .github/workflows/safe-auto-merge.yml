# Merge only after the Android build and version guard both pass for the exact PR head.
# GitHub's native auto-merge remains subject to repository branch rules and required checks.
name: Safe Auto Merge

on:
  workflow_run:
    workflows:
      - Build Android APK
      - Synchronize Project Version
    types:
      - completed

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: safe-auto-merge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  enable-auto-merge:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify every required workflow for this exact commit
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${PR_NUMBER}" || "${PR_NUMBER}" == "null" ]]; then
            echo "No associated pull request; refusing to merge."
            exit 1
          fi
          gh run list --commit "${SHA}" --limit 100 --json name,event,conclusion,headSha > runs.json
          for required in "Build Android APK" "Synchronize Project Version"; do
            if ! jq -e --arg name "${required}" --arg sha "${SHA}" \
              'any(.[]; .name == $name and .event == "pull_request" and .headSha == $sha and .conclusion == "success")' runs.json >/dev/null; then
              echo "::notice::Required workflow not successful for ${SHA}: ${required}"
              exit 1
            fi
          done
          gh pr view "${PR_NUMBER}" --json isDraft,mergeable,headRefOid,baseRefName > pr.json
          jq -e --arg sha "${SHA}" \
            '.isDraft == false and .mergeable == "MERGEABLE" and .headRefOid == $sha and .baseRefName == "main"' pr.json >/dev/null || {
              echo "::notice::PR is draft, conflicted, stale, or not targeting main; refusing to merge."
              exit 1
            }
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Enable GitHub native auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.gate.outputs.pr_number }}
        run: gh pr merge "${PR_NUMBER}" --auto --squash
