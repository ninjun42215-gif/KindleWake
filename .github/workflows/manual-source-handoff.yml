name: Manual Source Handoff Snapshot

on:
  workflow_dispatch:
  push:
    branches: ["main", "feature/**", "workflow/**"]

permissions:
  contents: read

concurrency:
  group: kindlewake-manual-handoff-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package and verify selected branch source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out selected branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Test handoff, organizer and project health safety tools
        run: |
          python3 -m unittest discover -s Kindlewake/tests -p 'test_source_handoff.py' -v
          python3 -m unittest discover -s Kindlewake/tests -p 'test_repository_organizer.py' -v
          python3 -m unittest discover -s Kindlewake/tests -p 'test_project_health_audit.py' -v

      - name: Package exact tracked source and split into verified parts
        env:
          OUTPUT_DIR: ${{ runner.temp }}/kindlewake-manual-handoff
        run: |
          set -euo pipefail
          python3 Kindlewake/tools/source_handoff.py pack \
            --repository-root . \
            --output-dir "$OUTPUT_DIR" \
            --part-size 25000000
          {
            echo "# Manual Kindlewake source handoff"
            echo ""
            echo "- Selected ref: $GITHUB_REF"
            echo "- Exact commit: $GITHUB_SHA"
            echo "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo ""
            echo "## Parts manifest"
            cat "$OUTPUT_DIR/Kindlewake-Source-Handoff-Parts/PARTS-MANIFEST.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload portable source handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Kindlewake-Manual-Source-Handoff
          path: ${{ runner.temp }}/kindlewake-manual-handoff/Kindlewake-Source-Handoff-Parts/*
          if-no-files-found: error
          retention-days: 30
