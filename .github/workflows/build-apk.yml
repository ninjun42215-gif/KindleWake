# Builds the Android installer from the extracted Godot source tree.
# The extracted Kindlewake/ source tree is canonical; no project ZIP upload is required.
name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "main"
      - "feature/sethmarch-regional-network"
      - "feature/creator-touch-portraits"
      - "feature/complete-portrait-coverage-audit"
    tags:
      - "v*"

# Routine builds only need to read source. Artifact upload uses the Actions
# runtime token and does not require repository-content write permission.
permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 76
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Verify extracted project exists
        shell: bash
        run: |
          set -euo pipefail
          test -f Kindlewake/project.godot || {
            echo "::error::Kindlewake source tree is missing. Restore the project files under Kindlewake/ before running the Android build."
            exit 1
          }
          test -f Kindlewake/tools/build_apk.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache JDK, Android SDK, Godot and export templates
        uses: actions/cache@v4
        with:
          path: ~/.kindlewake_build
          key: kindlewake-build-${{ hashFiles('Kindlewake/tools/build_apk.py') }}

      - name: Install icon-generation dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Generate updated launcher icons
        working-directory: Kindlewake
        run: python tools/make_icon.py

      - name: Import project, headless scene smoke test, strict tests and APK export
        working-directory: Kindlewake
        run: python tools/build_apk.py --strict --with-balance

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: Kindlewake-APK
          path: Kindlewake/dist/Kindlewake.apk
          if-no-files-found: error

      - name: Enable KVM acceleration for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch APK in Android emulator
        # Required release-candidate smoke test. The APK artifact is uploaded above,
        # so a device-validation failure still leaves the build available for diagnosis.
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: python3 Kindlewake/tools/validate_android_emulator.py

      - name: Upload test and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            Kindlewake/dist/logs/
            Kindlewake/dist/honor400-emulator.png
            Kindlewake/dist/android-logcat.txt
            Kindlewake/dist/android-window-displays.txt
            Kindlewake/dist/android-activities.txt
          if-no-files-found: ignore

  # Only immutable version-tag builds may publish a GitHub Release. Keep the
  # write-capable token out of pull-request and ordinary branch build jobs.
  publish-tag-release:
    name: Attach APK to version-tag release
    if: startsWith(github.ref, 'refs/tags/')
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download APK produced by this workflow run
        uses: actions/download-artifact@v4
        with:
          name: Kindlewake-APK
          path: dist

      - name: Verify APK artifact exists
        run: test -s dist/Kindlewake.apk

      - name: Attach the APK to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Kindlewake.apk
