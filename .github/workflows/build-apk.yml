# Builds the Android installer from the extracted Godot source tree.
# First run "Extract Godot Project into Repository" after uploading the latest Kindlewake_Project.zip.
name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Verify extracted project exists
        shell: bash
        run: |
          set -euo pipefail
          test -f Kindlewake/project.godot || {
            echo "::error::Kindlewake source tree is missing. Upload the latest Kindlewake_Project.zip and run the 'Extract Godot Project into Repository' workflow first."
            exit 1
          }
          test -f Kindlewake/tools/build_apk.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache JDK, Android SDK, Godot and export templates
        uses: actions/cache@v4
        with:
          path: ~/.kindlewake_build
          key: kindlewake-build-${{ hashFiles('Kindlewake/tools/build_apk.py') }}

      - name: Build the APK (tests are logged but do not block the build)
        working-directory: Kindlewake
        run: python tools/build_apk.py

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: Kindlewake-APK
          path: Kindlewake/dist/Kindlewake.apk
          if-no-files-found: error

      - name: Upload test and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: Kindlewake/dist/logs/
          if-no-files-found: ignore

      - name: Attach the APK to the release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Kindlewake/dist/Kindlewake.apk
