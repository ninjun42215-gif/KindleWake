# Builds the Android installer from the extracted Godot source tree.
# The extracted Kindlewake/ source tree is canonical; no project ZIP upload is required.
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "feature/sethmarch-regional-network"
      - "feature/rune-system-v1"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 76
    steps:
      - uses: actions/checkout@v4

      - name: Verify extracted project exists
        shell: bash
        run: |
          set -euo pipefail
          test -f Kindlewake/project.godot || {
            echo "::error::Kindlewake source tree is missing. Restore the project files under Kindlewake/ before running the Android build."
            exit 1
          }
          test -f Kindlewake/tools/build_apk.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache JDK, Android SDK, Godot and export templates
        uses: actions/cache@v4
        with:
          path: ~/.kindlewake_build
          key: kindlewake-build-${{ hashFiles('Kindlewake/tools/build_apk.py') }}

      - name: Import project, run strict tests and balance report, then build APK
        working-directory: Kindlewake
        run: python tools/build_apk.py --strict --with-balance

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: Kindlewake-APK
          path: Kindlewake/dist/Kindlewake.apk
          if-no-files-found: error
      - name: Package merge-ready source handoff
        working-directory: .
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          project = Path("Kindlewake")
          output = project / "dist" / "Kindlewake-Source-Handoff.zip"
          output.parent.mkdir(parents=True, exist_ok=True)
          excluded = {".godot", "dist", "keys"}
          with ZipFile(output, "w", ZIP_DEFLATED, compresslevel=6) as archive:
              for path in project.rglob("*"):
                  if not path.is_file():
                      continue
                  relative = path.relative_to(project)
                  if any(part in excluded for part in relative.parts):
                      continue
                  archive.write(path, (Path("Kindlewake") / relative).as_posix())
              handoff_files = [
                  Path("GDD_Kindlewake.md"),
                  Path("CONTINUATION_PROMPT.md"),
              ]
              handoff_files.extend(sorted(Path(".").glob("Feature_*.zip")))
              for path in handoff_files:
                  if path.is_file():
                      archive.write(path, path.as_posix())
          print(f"Created {output} ({output.stat().st_size} bytes)")

          # Split the completed ZIP into transport-safe chunks. Each part is
          # strictly <= 25 MiB; concatenate in lexical/numeric order to restore it.
          part_size = 25 * 1024 * 1024
          parts_dir = project / "dist" / "Kindlewake-Source-Handoff-Parts"
          parts_dir.mkdir(parents=True, exist_ok=True)
          with output.open("rb") as source:
              index = 1
              while True:
                  chunk = source.read(part_size)
                  if not chunk:
                      break
                  part = parts_dir / f"Kindlewake-Source-Handoff.zip.part{index:03d}"
                  part.write_bytes(chunk)
                  if part.stat().st_size > part_size:
                      raise RuntimeError(f"Part exceeds 25 MiB: {part}")
                  print(f"Created {part} ({part.stat().st_size} bytes)")
                  index += 1

          instructions = parts_dir / "REASSEMBLE.txt"
          instructions.write_text(
              "KINDLEWAKE SOURCE HANDOFF — REASSEMBLY\\n"
              "All .partNNN files are consecutive chunks of one ZIP archive.\\n"
              "Keep every part in this folder, then run from this folder:\\n\\n"
              "  cat Kindlewake-Source-Handoff.zip.part* > Kindlewake-Source-Handoff.zip\\n"
              "  unzip -t Kindlewake-Source-Handoff.zip\\n"
              "  unzip Kindlewake-Source-Handoff.zip\\n\\n"
              "Windows PowerShell:\\n"
              "  Get-Content -AsByteStream Kindlewake-Source-Handoff.zip.part* | Set-Content -AsByteStream Kindlewake-Source-Handoff.zip\\n"
              "Verify the reconstructed archive with 7-Zip or another ZIP utility.\\n"
              "Maximum individual part size: 25 MiB (26,214,400 bytes).\\n",
              encoding="utf-8",
          )
          PY

      - name: Upload split source handoff
        uses: actions/upload-artifact@v4
        with:
          name: Kindlewake-Source-Handoff-Parts
          path: Kindlewake/dist/Kindlewake-Source-Handoff-Parts/*
          if-no-files-found: error


      - name: Upload test and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: Kindlewake/dist/logs/
          if-no-files-found: ignore

      - name: Attach the APK to the release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Kindlewake/dist/Kindlewake.apk
