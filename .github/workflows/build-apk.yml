# Builds a non-production Android candidate from the extracted Godot source tree.
# Production releases are published only by publish-android-release.yml after protected approval.
name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "main"
      - "feature/sethmarch-regional-network"
      - "feature/creator-touch-portraits"
    tags:
      - "v*"

# Routine builds only need to read source. Artifact upload uses the Actions
# runtime token and does not require repository-content write permission.
permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 76
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Verify extracted project exists
        shell: bash
        run: |
          set -euo pipefail
          test -f Kindlewake/project.godot || {
            echo "::error::Kindlewake source tree is missing. Restore the project files under Kindlewake/ before running the Android build."
            exit 1
          }
          test -f Kindlewake/tools/build_apk.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache JDK, Android SDK, Godot and export templates
        uses: actions/cache@v4
        with:
          path: ~/.kindlewake_build
          key: kindlewake-build-${{ hashFiles('Kindlewake/tools/build_apk.py') }}

      - name: Install icon-generation dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Generate updated launcher icons
        working-directory: Kindlewake
        run: python tools/make_icon.py

      - name: Import project, headless scene smoke test, strict tests and APK export
        working-directory: Kindlewake
        run: python tools/build_apk.py --strict --with-balance

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: Kindlewake-APK
          path: Kindlewake/dist/Kindlewake.apk
          if-no-files-found: error

      - name: Install screenshot OCR tool
        run: |
          if ! command -v tesseract >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y tesseract-ocr
          fi
          tesseract --version | head -n 1

      - name: Enable KVM acceleration for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch APK in Android emulator
        # A package that installs but cannot launch is not runtime-verified.
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          # Standard Google APIs image avoids the AOSP ATD MultiDisplayService path that destroys Godot at startup.
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          # Use the emulator's default graphics backend; keep OCR as the visual gate.
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            # Keep the emulator's Pixel 5 display defaults; runtime rotation follows the project's landscape request.
            # Avoid wm size/density changes during Android startup because they trigger delayed display reconfiguration.
            adb shell settings put secure immersive_mode_confirmations confirmed
            adb shell settings put system font_scale 1.0
            adb install -r Kindlewake/dist/Kindlewake.apk
            adb logcat -c
            # Godot 4.2.2 exports this explicit launcher activity.
            adb shell cmd package resolve-activity --brief com.kindlewake.game
            adb shell am start -W -n com.kindlewake.game/com.godot.game.GodotApp
            sleep 30
            adb shell dumpsys window displays > Kindlewake/dist/android-window-displays.txt
            adb shell dumpsys activity activities > Kindlewake/dist/android-activities.txt
            # Capture logcat before smoke assertions so failed screenshots retain renderer and crash diagnostics.
            adb logcat -d -v time > Kindlewake/dist/android-logcat.txt
            # Require the Godot activity to remain resumed and the system overlay to be dismissed.
            python3 -c 'import pathlib,sys; s=pathlib.Path("Kindlewake/dist/android-window-displays.txt").read_text(errors="replace"); focus=next((line.strip() for line in s.splitlines() if "mCurrentFocus=" in line), ""); print("Focused window:", focus); sys.exit(1 if "ImmersiveModeConfirmation" in focus or not focus else 0)'
            python3 -c 'import pathlib,sys; s=pathlib.Path("Kindlewake/dist/android-activities.txt").read_text(errors="replace"); ok=any(("topResumedActivity=" in line or "ResumedActivity:" in line) and "com.kindlewake.game/com.godot.game.GodotApp" in line for line in s.splitlines()); print("Godot activity resumed:", ok); sys.exit(0 if ok else 1)'
            adb shell screencap -p /sdcard/kindlewake-honor400-layout.png
            adb pull /sdcard/kindlewake-honor400-layout.png Kindlewake/dist/honor400-emulator.png
            # Require visible title/menu content, not merely a live process.
            tesseract Kindlewake/dist/honor400-emulator.png stdout --psm 6 > Kindlewake/dist/android-screen-ocr.txt 2> Kindlewake/dist/tesseract.txt
            grep -qi "KINDLEWAKE" Kindlewake/dist/android-screen-ocr.txt || { echo "::error::Title text was not visible in the Android screenshot."; cat Kindlewake/dist/android-screen-ocr.txt; exit 1; }
            grep -qi "NEW GAME" Kindlewake/dist/android-screen-ocr.txt || { echo "::error::New Game menu text was not visible in the Android screenshot."; cat Kindlewake/dist/android-screen-ocr.txt; exit 1; }
            grep -qi "SETTINGS" Kindlewake/dist/android-screen-ocr.txt || { echo "::error::Settings menu text was not visible in the Android screenshot."; cat Kindlewake/dist/android-screen-ocr.txt; exit 1; }
            grep -n -E "FATAL EXCEPTION|Fatal signal|SCRIPT ERROR|Parse Error|USER ERROR|USER WARNING|GodotActivity|Process com.kindlewake.game" Kindlewake/dist/android-logcat.txt | tail -n 120 || true
            # android-emulator-runner executes each script line with /usr/bin/sh; keep assertions single-line.
            python3 -c 'import pathlib,re,sys; lines=pathlib.Path("Kindlewake/dist/android-logcat.txt").read_text(errors="replace").splitlines(); hits=[f"{i+1}: {line}" for i,line in enumerate(lines) if re.search(r"FATAL EXCEPTION|Fatal signal|SCRIPT ERROR|Parse Error", line)]; print("\n".join(hits[-80:])); sys.exit(1 if hits else 0)'
            adb shell pidof com.kindlewake.game | grep -q . || python3 -c 'raise SystemExit("Kindlewake did not remain running after explicit launcher activity start")'

      - name: Upload test and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            Kindlewake/dist/logs/
            Kindlewake/dist/honor400-emulator.png
            Kindlewake/dist/android-logcat.txt
            Kindlewake/dist/android-window-displays.txt
            Kindlewake/dist/android-activities.txt
            Kindlewake/dist/android-screen-ocr.txt
            Kindlewake/dist/tesseract.txt
          if-no-files-found: ignore

