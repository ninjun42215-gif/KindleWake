# Repository-wide CI: strict Godot validation, Android APK and portable source handoff.
# All work is tied to the exact triggering ref/SHA; source handoff is independent of APK success.
name: Build Android APK and Source Handoff

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags:
      - "*"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: kindlewake-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    name: Validate and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out the triggering ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify project and version configuration
        shell: bash
        run: |
          set -euo pipefail
          test -f Kindlewake/project.godot
          test -f Kindlewake/export_presets.cfg
          test -f Kindlewake/tools/build_apk.py
          python3 - <<'PY'
          import re
          from pathlib import Path
          root = Path("Kindlewake")
          project = (root / "project.godot").read_text(encoding="utf-8")
          preset = (root / "export_presets.cfg").read_text(encoding="utf-8")
          project_version = re.search(r'^config/version\s*=\s*"([^"]+)"', project, re.M)
          preset_version = re.search(r'^version/name\s*=\s*"([^"]+)"', preset, re.M)
          if not project_version or not preset_version:
              raise SystemExit("Project or Android preset version is missing.")
          if project_version.group(1) != preset_version.group(1):
              raise SystemExit(
                  "Version mismatch: project.godot=%s, Android preset=%s. "
                  "Update both deliberately before building." %
                  (project_version.group(1), preset_version.group(1))
              )
          print("Project and Android export version: " + project_version.group(1))
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Android build toolchain
        uses: actions/cache@v4
        with:
          path: ~/.kindlewake_build
          key: ${{ runner.os }}-kindlewake-${{ hashFiles('Kindlewake/tools/build_apk.py') }}
          restore-keys: |
            ${{ runner.os }}-kindlewake-

      - name: Import, strict tests, balance report and Android export
        working-directory: Kindlewake
        run: python tools/build_apk.py --strict --with-balance

      - name: Create APK checksum and build manifest
        if: success()
        working-directory: Kindlewake
        env:
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          root = Path(".")
          apk = root / "dist" / "Kindlewake.apk"
          if not apk.is_file():
              raise SystemExit("APK is missing; refusing to create a success manifest.")
          project = (root / "project.godot").read_text(encoding="utf-8")
          preset = (root / "export_presets.cfg").read_text(encoding="utf-8")
          def match(pattern, text):
              found = re.search(pattern, text, re.M)
              return found.group(1) if found else None
          manifest = {
              "artifact": apk.name,
              "sha256": hashlib.sha256(apk.read_bytes()).hexdigest(),
              "size_bytes": apk.stat().st_size,
              "project": "Kindlewake",
              "version_name": match(r'^config/version\s*=\s*"([^"]+)"', project),
              "android_version_name": match(r'^version/name\s*=\s*"([^"]+)"', preset),
              "android_version_code": match(r'^version/code\s*=\s*(\d+)', preset),
              "application_id": match(r'^package/unique_name\s*=\s*"([^"]+)"', preset),
              "repository": os.environ["GITHUB_REPOSITORY"],
              "ref": os.environ["SOURCE_REF"],
              "commit": os.environ["SOURCE_SHA"],
              "event": os.environ["EVENT_NAME"],
              "run_id": os.environ["RUN_ID"],
              "run_attempt": os.environ["RUN_ATTEMPT"],
          }
          out = root / "dist"
          (out / "Kindlewake.apk.sha256").write_text(
              manifest["sha256"] + "  Kindlewake.apk\n", encoding="utf-8"
          )
          (out / "release-manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(manifest, indent=2))
          PY

      - name: Upload Android APK and provenance
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kindlewake-APK
          path: |
            Kindlewake/dist/Kindlewake.apk
            Kindlewake/dist/Kindlewake.apk.sha256
            Kindlewake/dist/release-manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload test and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: Kindlewake/dist/logs/
          if-no-files-found: ignore
          retention-days: 30

      - name: Explain tagged build status
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "This tag produced a verified build candidate artifact."
          echo "Production publishing is a separate manually approved workflow."

  source-handoff:
    name: Package and verify portable AI source handoff
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact triggering commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Test handoff packer and recovery utility
        run: |
          python3 -m unittest discover -s Kindlewake/tests -p 'test_source_handoff.py' -v
          python3 -m unittest discover -s Kindlewake/tests -p 'test_repository_organizer.py' -v

      - name: Package, inventory, hash and partition tracked source
        shell: bash
        env:
          HANDOFF_OUTPUT: ${{ runner.temp }}/kindlewake-source-handoff
        run: |
          set -euo pipefail
          python3 Kindlewake/tools/source_handoff.py pack \
            --repository-root . \
            --output-dir "$HANDOFF_OUTPUT" \
            --part-size 25000000
          cat "$HANDOFF_OUTPUT/Kindlewake-Source-Handoff-Parts/PARTS-MANIFEST.json"
          {
            echo "## Source handoff package"
            echo ""
            echo "- Snapshot ref: \`$GITHUB_REF\`"
            echo "- Exact commit: \`$GITHUB_SHA\`"
            echo "- Partition limit: 25,000,000 bytes per part"
            echo "- Recovery: see REASSEMBLE.txt"
            echo "- AI entry point: AI_NEXT_SESSION.md"
            echo ""
            echo "Parts manifest:"
            cat "$HANDOFF_OUTPUT/Kindlewake-Source-Handoff-Parts/PARTS-MANIFEST.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified split source handoff
        uses: actions/upload-artifact@v4
        with:
          name: Kindlewake-Source-Handoff-Parts
          path: ${{ runner.temp }}/kindlewake-source-handoff/Kindlewake-Source-Handoff-Parts/*
          if-no-files-found: error
          retention-days: 90

  result-report:
    name: Recommend next actions from workflow results
    if: always()
    needs:
      - android-build
      - source-handoff
    runs-on: ubuntu-latest
    steps:
      - name: Publish actionable result summary
        env:
          APK_RESULT: ${{ needs.android-build.result }}
          HANDOFF_RESULT: ${{ needs.source-handoff.result }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORT_PATH: ${{ runner.temp }}/Kindlewake-Workflow-Report.md
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# Kindlewake workflow result and next-step recommendations"
            echo ""
            echo "- Source ref: \`$SOURCE_REF\`"
            echo "- Exact commit: \`$SOURCE_SHA\`"
            echo "- Run: [Open GitHub Actions run]($RUN_URL)"
            echo ""
            echo "| Pipeline | Result | Artifact |"
            echo "|---|---|---|"
            echo "| Android validation/build | $APK_RESULT | Kindlewake-APK (only on success); test-logs |"
            echo "| Source handoff | $HANDOFF_RESULT | Kindlewake-Source-Handoff-Parts (only on success) |"
            echo ""
            echo "## Recommended next action"
            if [[ "$HANDOFF_RESULT" == "success" ]]; then
              echo "- Download all source handoff files, reconstruct with REASSEMBLE.txt, verify hashes and ZIP integrity, then extract into a new folder."
              echo "- Give the next AI AI_NEXT_SESSION.md and require it to inspect the live repository and this exact commit before editing."
            else
              echo "- Source handoff failed: inspect the source-handoff job logs and fix packaging/tests before treating this run as transferable."
            fi
            if [[ "$APK_RESULT" == "success" ]]; then
              echo "- Download Kindlewake-APK; verify release-manifest.json and SHA-256 against the exact source commit."
              echo "- Next quality gate: install on a physical Android device and test launch, save/load, touch, orientation and rendering. CI is not device QA."
            elif [[ "$APK_RESULT" == "failure" ]]; then
              echo "- APK build failed: inspect the failing android-build step and test-logs, fix the first root cause, then push a new commit and verify the new branch-head run."
            elif [[ "$APK_RESULT" == "cancelled" ]]; then
              echo "- APK build was cancelled: rerun CI on the current intended commit before distributing an APK."
            else
              echo "- APK build result is $APK_RESULT: inspect the android-build job before claiming an APK exists."
            fi
            echo ""
            echo "## Safety and release guidance"
            echo "- Do not use a stale artifact as proof for a newer commit."
            echo "- Do not publish a production release from a CI candidate; use the separately protected production workflow."
            echo "- Do not merge PRs or modify main without explicit user authorization."
          } | tee "$REPORT_PATH" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload portable workflow result and recommendations
        uses: actions/upload-artifact@v4
        with:
          name: Kindlewake-Workflow-Report
          path: ${{ runner.temp }}/Kindlewake-Workflow-Report.md
          if-no-files-found: error
          retention-days: 90
