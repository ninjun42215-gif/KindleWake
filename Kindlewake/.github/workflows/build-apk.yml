# Builds the Android installer (APK) in the cloud, so no Android tools are needed on your own PC.
# Run it: GitHub repo -> Actions -> "Build Android APK" -> Run workflow.
# Result: the run page has an "Kindlewake-APK" download (a zip containing Kindlewake.apk) and "test-logs".
# Tag a release (for example v0.5.1) and the APK is also attached to that release as a direct download.
name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache JDK, Android SDK, Godot and export templates
        uses: actions/cache@v4
        with:
          path: ~/.kindlewake_build
          key: kindlewake-build-${{ hashFiles('tools/build_apk.py') }}

      - name: Build the APK (tests are logged but do not block the build)
        run: python tools/build_apk.py

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: Kindlewake-APK
          path: dist/Kindlewake.apk
          if-no-files-found: error

      - name: Upload test and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: dist/logs/
          if-no-files-found: ignore

      - name: Attach the APK to the release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Kindlewake.apk
